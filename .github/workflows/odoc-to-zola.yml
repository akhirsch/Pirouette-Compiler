# replaced the old contents so i can push and see if the workflow works as expected
# the old file was handling the docs only halfway
# It put them in the right place for Zola, but nothing ever built or deployed the Zola site afterward
name: odoc-to-zola

on:
# Lets other workflows run this one as a reusable workflow
  workflow_call:
# Adds a "Run workflow" button in the Actions tab for manual runs
  workflow_dispatch:

# defines which branch this work flow will execute on when pushed 
  push:
    branches:
      - 'main'
      - 'dev'

    paths-ignore:
      - '.githooks/**'
      - '**/LICENSE'
      - '**/*.md'

permissions: read-all

# concurrency works as a safety net incase main and dev are pushed directly one after another 
# need to have the last push be the one that the site deploys giving permissions to cancel in progress workflow
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Build the Zola site and the odoc docs, combine them, and upload as one Pages artifact
  build:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      pages: write
      id-token: write
 
    steps:
      - name: Checkout compiler
        uses: actions/checkout@v6
 
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
 
      - name: Set-up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.2.1
 
      - name: Install Dune
        run: opam install dune
 
      - name: Install Odoc
        run: opam install odoc
 
      - name: Generate Opam
        run: opam exec -- dune build @opam
 
      - name: Install dependencies
        run: opam install . --deps-only --with-test
 
      - name: Build
        run: opam exec -- dune build
 
      # index.html ends up in ./_build/default/_doc/_html/
      - name: Build Docs
        run: opam exec -- dune build @doc

      # moved checkout zola site here after the dune steps Github told me
      # this was problematic before bc dune trying to scan a symlink that was already scanned 
      - name: Checkout Zola site
        uses: actions/checkout@v6
        with:
          ref: zola-site
          path: zola-site
          submodules: recursive

      - name: Install Zola
        uses: taiki-e/install-action@v2
        with:
          tool: zola@0.22.1
 
      - name: Build Zola site
        working-directory: zola-site
        run: zola build --base-url "${{ steps.pages.outputs.base_url }}"
 
      # Docs are served at <site>/module-docs/
      # GitHub Actions passes that block to the shell as a script, and each line runs as its own command, one after another
      # for workflows you can also chain commands with &&, avoiding that need for the arm |
      - name: Add docs to site
        run: |
          mkdir -p zola-site/public/module-docs
          cp -r _build/default/_doc/_html/. zola-site/public/module-docs/
 
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: zola-site/public

 # takes that pages artifact and makes it live, needs environment: github-pages, or GitHub refuses the deploy
 # Build the docs first then build site and at this stage we are deploying the zola site 
  deploy:
    needs: build
    runs-on: ubuntu-latest
 
    permissions:
      pages: write
      id-token: write
 
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
 
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
          